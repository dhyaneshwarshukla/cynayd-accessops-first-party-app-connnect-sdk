name: SDK contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contract:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run example
  host-bindings:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sdk_fixture
          POSTGRES_PASSWORD: sdk_fixture
          POSTGRES_DB: sdk_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdk_fixture -d sdk_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SDK_TEST_DATABASE_URL: postgresql://sdk_fixture:sdk_fixture@127.0.0.1:5432/sdk_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm install --no-save --package-lock=false express@4 pg@8 @nestjs/core@11 @nestjs/platform-express@11
      - run: node examples/host/qualify.cjs
      - run: SDK_TEST_FRAMEWORK=node node examples/host/qualify.cjs
      - run: SDK_TEST_FRAMEWORK=nest node examples/host/qualify.cjs
      - run: python -m pip install './python[fastapi]' pytest
      - run: python -m pytest -q python/tests
