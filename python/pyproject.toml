[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cynayd-first-party"
version = "0.6.0rc9"
description = "Python binding for the CYNAYD first-party delegation contract"
requires-python = ">=3.11"
dependencies = ["cryptography>=41", "httpx>=0.27", "PyJWT>=2.8"]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115", "psycopg[binary,pool]>=3.2"]

[tool.setuptools.packages.find]
include = ["cynayd_first_party*"]
